<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C2C"/>
      <stop offset="60%" stop-color="#0B2A40"/>
      <stop offset="100%" stop-color="#1677A8"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="100%" stop-color="#F6C400"/>
    </linearGradient>
    <linearGradient id="pvCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E709F"/>
      <stop offset="100%" stop-color="#0B2A40"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22394A"/>
      <stop offset="100%" stop-color="#142433"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="240" rx="16" fill="url(#skyGrad)"/>

  <!-- Sun with Radiance Rings -->
  <circle cx="330" cy="55" r="32" fill="url(#sunGlow)" opacity="0.95"/>
  <circle cx="330" cy="55" r="42" stroke="#F6C400" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="330" cy="55" r="54" stroke="#F6C400" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.3"/>

  <!-- Sun Rays streaming down to roof -->
  <line x1="305" y1="75" x2="245" y2="125" stroke="#F6C400" stroke-width="2" stroke-linecap="round" opacity="0.4" stroke-dasharray="6 4"/>
  <line x1="320" y1="90" x2="275" y2="135" stroke="#F6C400" stroke-width="2" stroke-linecap="round" opacity="0.4" stroke-dasharray="6 4"/>

  <!-- Modern House / Building Base -->
  <path d="M 60 215 L 60 145 L 200 80 L 340 145 L 340 215 Z" fill="#E2E9ED" opacity="0.12"/>
  <path d="M 50 148 L 200 78 L 350 148 L 340 158 L 200 93 L 60 158 Z" fill="#6D7D89"/>

  <!-- Slanted Roof Surface for PV Mounting -->
  <polygon points="80,145 200,88 320,145 200,195" fill="url(#roofGrad)" stroke="#38B9D3" stroke-width="1" opacity="0.9"/>

  <!-- PV Array (3x2 Modules arranged in perspective) -->
  <!-- Top Row Panels -->
  <g transform="matrix(0.92, -0.42, 0.92, 0.45, 20, 115)">
    <!-- Panel 1 -->
    <rect x="0" y="0" width="38" height="24" rx="2" fill="url(#pvCell)" stroke="#A8D9E9" stroke-width="1.5"/>
    <line x1="19" y1="0" x2="19" y2="24" stroke="#65B8D4" stroke-width="0.8"/>
    <line x1="0" y1="12" x2="38" y2="12" stroke="#65B8D4" stroke-width="0.8"/>
    <!-- Panel 2 -->
    <rect x="42" y="0" width="38" height="24" rx="2" fill="url(#pvCell)" stroke="#A8D9E9" stroke-width="1.5"/>
    <line x1="61" y1="0" x2="61" y2="24" stroke="#65B8D4" stroke-width="0.8"/>
    <line x1="42" y1="12" x2="80" y2="12" stroke="#65B8D4" stroke-width="0.8"/>
    <!-- Panel 3 -->
    <rect x="84" y="0" width="38" height="24" rx="2" fill="url(#pvCell)" stroke="#A8D9E9" stroke-width="1.5"/>
    <line x1="103" y1="0" x2="103" y2="24" stroke="#65B8D4" stroke-width="0.8"/>
    <line x1="84" y1="12" x2="122" y2="12" stroke="#65B8D4" stroke-width="0.8"/>

    <!-- Bottom Row Panels -->
    <!-- Panel 4 -->
    <rect x="0" y="28" width="38" height="24" rx="2" fill="url(#pvCell)" stroke="#A8D9E9" stroke-width="1.5"/>
    <line x1="19" y1="28" x2="19" y2="52" stroke="#65B8D4" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="38" y2="40" stroke="#65B8D4" stroke-width="0.8"/>
    <!-- Panel 5 -->
    <rect x="42" y="28" width="38" height="24" rx="2" fill="url(#pvCell)" stroke="#A8D9E9" stroke-width="1.5"/>
    <line x1="61" y1="28" x2="61" y2="52" stroke="#65B8D4" stroke-width="0.8"/>
    <line x1="42" y1="40" x2="80" y2="40" stroke="#65B8D4" stroke-width="0.8"/>
    <!-- Panel 6 -->
    <rect x="84" y="28" width="38" height="24" rx="2" fill="url(#pvCell)" stroke="#A8D9E9" stroke-width="1.5"/>
    <line x1="103" y1="28" x2="103" y2="52" stroke="#65B8D4" stroke-width="0.8"/>
    <line x1="84" y1="40" x2="122" y2="40" stroke="#65B8D4" stroke-width="0.8"/>
  </g>

  <!-- Technical Label Pill -->
  <g transform="translate(24, 28)">
    <rect width="135" height="26" rx="6" fill="#071C2C" stroke="#F6C400" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4" fill="#F6C400"/>
    <text x="26" y="17" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SOLAR ROOFTOP</text>
  </g>
</svg>
