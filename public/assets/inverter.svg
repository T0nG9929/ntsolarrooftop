<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="invCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C2C"/>
      <stop offset="60%" stop-color="#0D2A40"/>
      <stop offset="100%" stop-color="#124A6E"/>
    </linearGradient>
    <linearGradient id="invChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#invCardBg)"/>

  <!-- Inverter Unit Central Body -->
  <g transform="translate(130, 25)">
    <!-- Heat Sink Fins (Right side) -->
    <rect x="135" y="20" width="8" height="150" rx="2" fill="#64748B" opacity="0.6"/>
    <rect x="145" y="20" width="8" height="150" rx="2" fill="#64748B" opacity="0.6"/>

    <!-- Main Chassis Housing -->
    <rect x="0" y="0" width="140" height="185" rx="10" fill="url(#invChassis)" stroke="#94A3B8" stroke-width="2"/>
    <!-- Top Accent Bar (NT Yellow) -->
    <path d="M 0 10 Q 0 0 10 0 L 130 0 Q 140 0 140 10 L 140 16 L 0 16 Z" fill="#F6C400"/>

    <!-- Digital Display Screen -->
    <rect x="20" y="32" width="100" height="48" rx="6" fill="url(#screenGrad)" stroke="#10B981" stroke-width="1.5"/>
    <text x="30" y="52" fill="#34D399" font-family="monospace" font-size="11" font-weight="700">5.00 kW</text>
    <text x="30" y="68" fill="#6EE7B7" font-family="monospace" font-size="8">MPPT OK · 98.4%</text>

    <!-- LED Status Indicators -->
    <circle cx="35" cy="95" r="4" fill="#10B981"/> <!-- Green Power -->
    <text x="45" y="98" fill="#334155" font-family="sans-serif" font-size="8" font-weight="600">GRID</text>

    <circle cx="85" cy="95" r="4" fill="#38B9D3"/> <!-- Cyan Comm -->
    <text x="95" y="98" fill="#334155" font-family="sans-serif" font-size="8" font-weight="600">WIFI</text>

    <!-- DC Isolator Rotary Switch -->
    <circle cx="70" cy="132" r="16" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>
    <rect x="67" y="120" width="6" height="24" rx="2" fill="#FFFFFF"/>
    <text x="70" y="160" fill="#475569" font-family="sans-serif" font-size="7" font-weight="700" text-anchor="middle">DC ISOLATOR</text>

    <!-- Cable Entry Glands (Bottom) -->
    <rect x="25" y="185" width="16" height="10" rx="3" fill="#334155"/>
    <rect x="52" y="185" width="16" height="10" rx="3" fill="#334155"/>
    <rect x="80" y="185" width="16" height="10" rx="3" fill="#334155"/>
    <rect x="105" y="185" width="16" height="10" rx="3" fill="#334155"/>
  </g>

  <!-- AC & DC Energy Wave Graphic -->
  <g transform="translate(30, 80)">
    <text x="0" y="0" fill="#38B9D3" font-family="sans-serif" font-size="10" font-weight="700">DC IN (Solar)</text>
    <line x1="0" y1="12" x2="80" y2="12" stroke="#F6C400" stroke-width="2"/>
    <line x1="0" y1="18" x2="80" y2="18" stroke="#F6C400" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <g transform="translate(295, 80)">
    <text x="0" y="0" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700">AC OUT (Grid/Load)</text>
    <path d="M 0 15 Q 15 0 30 15 T 60 15 T 90 15" fill="none" stroke="#34D399" stroke-width="2.5"/>
  </g>

  <!-- Technical Label Pill -->
  <g transform="translate(24, 28)">
    <rect width="130" height="26" rx="6" fill="#071C2C" stroke="#38B9D3" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4" fill="#38B9D3"/>
    <text x="26" y="17" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">INVERTER UNIT</text>
  </g>
</svg>
