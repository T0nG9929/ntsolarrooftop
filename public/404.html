<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>NT Solar Academy</title>
  <script>
    // Single Page Apps for GitHub Pages
    // Preserves query strings and hashes when redirecting back to root
    (function () {
      var segmentCount = 1;
      var location = window.location;
      var path = location.pathname.slice(1).split('/');
      var repo = path[0];
      var target = '/' + repo + '/';
      window.location.replace(target + '#' + location.pathname.slice(repo.length + 2) + location.search + location.hash);
    })();
  </script>
</head>
<body>
  <p>กำลังนำทางไปยัง NT Solar Academy...</p>
</body>
</html>
